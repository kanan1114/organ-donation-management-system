<!DOCTYPE html>
<html>

<head>

<title>Organ Matches</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

<div class="logo">
OrganCare
</div>

<a href="/">Home</a>
<a href="/dashboard">Dashboard</a>
<a href="/donors">Donors</a>
<a href="/add_donor">Add Donor</a>
<a href="/recipients">Recipients</a>
<a href="/hospitals">Hospitals</a>
<a href="/transplants">Transplants</a>
<a href="/search">Search</a>
<a href="/matches">Matches</a>
<a href="/logout">Logout</a>

</div>

<div class="main-content">

<div class="topbar">

<h1>
Compatible Organ Matches
</h1>

</div>

<div class="content-panel">

<table>

<tr>
<th>Donor</th>
<th>Blood Group</th>
<th>Organ</th>
<th>Recipient</th>
<th>Required Organ</th>
</tr>

{% for m in matches %}

<tr>

<td>{{ m[0] }}</td>
<td>{{ m[1] }}</td>
<td>{{ m[2] }}</td>
<td>{{ m[3] }}</td>
<td>{{ m[4] }}</td>

</tr>

{% endfor %}

</table>

</div>
</div>
</body>
</html>
